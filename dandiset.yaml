datePublished: '2026-10-13T20:16:45.025443+00:00'
description: 'Simultaneous voltage imaging of ~320 layer 1 interneurons in barrel
  cortex of awake, head-fixed mice running freely on a treadmill.  Two NDNF-cre::NPY-GFP
  mice expressing DIO-Voltron-ST-p2a-CheRiff-ST in barrel cortex were imaged at 787
  Hz (1.27 ms exposure) while blue light was used to stimulate sparse, trial-varying
  subsets of the same cells. Voltron reports membrane voltage; the co-expressed CheRiff
  provides optogenetic drive, making each session an all-optical electrophysiology
  experiment. GFP independently labels the NPY-positive subset, so cell identity is
  available alongside activity.  Each mouse contributed three sessions:  - Spontaneous
  activity (10 trials), with no stimulation. - Intrinsic excitability mapping (300
  trials): four 500 ms steps and one 5 s   ramp delivered to sparse cell subsets,
  yielding per-cell rheobase, maximum   firing rate, adaptation, after-depolarization
  and membrane time constant. - Connectivity mapping (640 trials): brief pulses for
  synaptic connectivity,   with every fourth trial using dense, temporally uncorrelated
  stimulation   designed for gap-junction mapping.  Every session file contains spike-height-normalized
  voltage traces, the spike-removed subthreshold component, inferred spike times,
  per-cell coordinates and intrinsic properties, treadmill running speed, a whisking
  trace and face movie, and trial and stimulus tables.  A seventh asset provides the
  raw, unregistered camera movie for four acquisition blocks (24 minutes) of one spontaneous
  session, together with the motion-correction, demixing and spike-finding products
  needed to run the full pipeline on it from scratch.'
